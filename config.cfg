[api]
host = localhost
port = 8080
max_upload_size_bytes = 10485760
max_image_dimension = 10000
max_image_pixels = 40000000
image_list_limit = 100

[database]
min_pool_size = 1
max_pool_size = 10
command_timeout = 30
migrations_directory = app/db/migrations

[redis]
queue_name = image_tasks

[storage]
image_directory = storage/uploads

[logging]
enabled = true
stdout = true
file = true
file_path = logs/application.jsonl
level = INFO
rotation = 10 MB
retention = 14 days
read_limit = 100
max_read_limit = 1000
